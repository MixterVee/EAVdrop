name: Build EAVdrop

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore approved app icon
        shell: pwsh
        run: |
          $parts = @(
            'BuildAssets/appicon.b64.00',
            'BuildAssets/appicon.b64.01',
            'BuildAssets/appicon.b64.02'
          )
          $encoded = ($parts | ForEach-Object { [IO.File]::ReadAllText($_).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          New-Item -ItemType Directory -Force -Path Resources/AppIcon | Out-Null
          [IO.File]::WriteAllBytes('Resources/AppIcon/appicon.png', $bytes)
          $hash = (Get-FileHash Resources/AppIcon/appicon.png -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '6b65209cfe3a551c265638182f2e2cb0cb1d83e90f5cc6b9233252fab93efdfb') { throw "Icon hash mismatch: $hash" }
          Write-Host "Approved icon verified: $hash"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui

      - name: Restore
        shell: pwsh
        run: dotnet restore EAVdrop.csproj

      - name: Build Android APK
        shell: pwsh
        run: dotnet publish EAVdrop.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk -o artifacts/android

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: EAVdrop-Android
          path: artifacts/android/**/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore approved app icon
        shell: pwsh
        run: |
          $parts = @(
            'BuildAssets/appicon.b64.00',
            'BuildAssets/appicon.b64.01',
            'BuildAssets/appicon.b64.02'
          )
          $encoded = ($parts | ForEach-Object { [IO.File]::ReadAllText($_).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          New-Item -ItemType Directory -Force -Path Resources/AppIcon | Out-Null
          [IO.File]::WriteAllBytes('Resources/AppIcon/appicon.png', $bytes)
          $hash = (Get-FileHash Resources/AppIcon/appicon.png -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '6b65209cfe3a551c265638182f2e2cb0cb1d83e90f5cc6b9233252fab93efdfb') { throw "Icon hash mismatch: $hash" }
          Write-Host "Approved icon verified: $hash"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Windows ICO
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; i=Image.open('Resources/AppIcon/appicon.png').convert('RGBA'); i.save('appicon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128)]); print('ICO generated from approved icon:', i.size)"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui

      - name: Restore
        shell: pwsh
        run: dotnet restore EAVdrop.csproj

      - name: Build Windows x64
        shell: pwsh
        run: dotnet publish EAVdrop.csproj -f net10.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o artifacts/windows

      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/EAVdrop-Windows-x64.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: EAVdrop-Windows-x64
          path: artifacts/EAVdrop-Windows-x64.zip
          if-no-files-found: error
